[workspace]
members = ["microvisor-common", "xtask"]
# microvisor-ebpf has its own [workspace] header and is built separately
# via `cargo xtask build-ebpf` with --target bpfel-unknown-none
resolver = "2"

[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["ioctl", "net", "socket"] }
opentelemetry = { version = "0.28.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.28.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28.0", features = ["grpc-tonic"] }
rand = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.29.0"
tracing-subscriber = { version = "0.3.19", features = ["json", "registry", "env-filter"] }
vmm-sys-util = "0.15.0"
aya = { version = "0.13", features = ["async_tokio"] }
microvisor-common = { path = "microvisor-common", features = ["userspace"] }

[dev-dependencies]
tempfile = "3.27.0"
