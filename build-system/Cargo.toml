[package]
name = "build-system"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
walkdir = "2.3"
hostname = "0.3"
tonic = "0.10"
prost = "0.12"
tokio-stream = "0.1"
clap = { version = "4.0", features = ["derive"] }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tempfile = "3.0"

